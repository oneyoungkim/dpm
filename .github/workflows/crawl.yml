name: 일정 수집

# 크롤 결과(data/events.json)를 레포에 커밋한다.
# 서버리스 배포는 파일시스템이 읽기 전용이라 런타임에 크롤할 수 없다.
# 대신 여기서 주기적으로 긁어 커밋 → 배포가 자동으로 갱신되는 구조.
on:
  schedule:
    # 매일 KST 06:00 (전날 UTC 21:00)
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "앞으로 며칠치를 수집할지"
        required: false
        default: "35"

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: 공식 피드에서 이벤트 후보 발견
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_EVENT_MODEL: gpt-5.4-nano-2026-03-17
          DISCOVERY_WEB_SEARCH: "1"
        run: npm run discover

      - name: 크롤 실행
        run: npm run crawl -- --days ${{ inputs.days || '35' }}

      - name: 변경분 커밋
        run: |
          git config user.name "dpmbros-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/candidates.json data/events.json
          # 스코어 하나 안 바뀐 시간대에는 빈 커밋을 만들지 않는다
          if git diff --staged --quiet; then
            echo "바뀐 것 없음"
            exit 0
          fi
          git commit -m "chore: 일정 갱신 $(date -u +'%Y-%m-%d %H:%M UTC')"
          # 순위 갱신(trends.yml)·매거진 발행과 푸시가 겹칠 수 있어 rebase 후 3번까지 다시 민다
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "푸시 실패(${attempt}/3) — 잠시 뒤 다시"
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 10))
          done
          echo "푸시 3번 실패"
          exit 1
